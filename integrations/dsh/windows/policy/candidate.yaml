schema_version: 1
platform: windows
security_domain_id: finshield.dsh
integrations:
- dsh
policy:
  filesystem_coverage:
    root: read_write
    rules:
    - id: host-recycle-bin
      source: windows_mandatory
      path: $Recycle.Bin
      access: host
      lifecycle: existing
      inheritance: descendants
  filesystem:
  - id: dsh-plugin-install-root
    source: dsh_compatibility
    path: ${DSH_PLUGIN_INSTALL_ROOT}
    access: read_only
    lifecycle: existing
    inheritance: descendants
  - id: dsh-home
    source: dsh_compatibility
    path: '{dsh_data_dir}'
    access: read_write
    lifecycle: prepare_created
    inheritance: descendants
  - id: dsh-default-workspace
    source: dsh_compatibility
    path: '{dsh_documents_dir}\deepseek-harness\default-workspace'
    access: read_write
    lifecycle: prepare_created
    inheritance: descendants
  - id: dsh-node-temp
    source: dsh_compatibility
    path: '{dsh_node_temp_dir}'
    access: read_write
    lifecycle: prepare_created
    inheritance: descendants
  - id: deny-360se-profile
    source: windows_mandatory
    path: ${APPDATA}\360se6\User Data
    access: deny
    lifecycle: existing
    inheritance: descendants
  - id: deny-bitwarden-desktop
    source: windows_mandatory
    path: ${APPDATA}\Bitwarden
    access: deny
    lifecycle: existing
