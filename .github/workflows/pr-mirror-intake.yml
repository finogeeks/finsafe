# Uses only the base workflow; never checks out or executes pull-request code.
name: Public PR intake

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    concurrency:
      group: finsafe-pr-intake-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILES: /tmp/pr-files.txt
        run: |
          set -euo pipefail
          gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json files -q '.files[].path' > "${PR_FILES}"
          node --input-type=module <<'JS' > /tmp/classify.txt
          import { readFileSync } from 'node:fs'
          const paths = readFileSync(process.env.PR_FILES, 'utf8').trim().split('\n').filter(Boolean)
          const publicFiles = new Set(['README.md', 'README-zh.md', 'CONTRIBUTING.md', 'CONTRIBUTING-zh.md', 'AGENTS.md'])
          const publicDoc = (path) => publicFiles.has(path) || path.startsWith('docs/') || path.startsWith('skills/')
            || /^(integrations|pii-plugins)\/.+\.(md|html)$/i.test(path)
          const delivery = (path) => /^(integrations|pii-plugins|examples|packaging|scripts)\//.test(path)
            || /^(install.*\.(sh|ps1|cmd)|CHANGELOG\.md)$/.test(path)
          const verdict = !paths.length ? 'empty' : paths.every(publicDoc) ? 'docs-only'
            : paths.every((path) => publicDoc(path) || delivery(path) || path.startsWith('.github/workflows/'))
              ? 'maintainer-review' : 'runtime-or-mixed'
          console.log(verdict)
          JS
          echo "verdict=$(cat /tmp/classify.txt)" >> "${GITHUB_OUTPUT}"
      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.classify.outputs.verdict }}
        run: |
          set -euo pipefail
          if [[ "${VERDICT}" == "docs-only" ]]; then
            cat > /tmp/pr-comment.md <<'EOF'
          Thanks for the contribution. Website, user documentation and repository guides are maintained directly in this public repository. Maintainers can review and merge this PR here; no private-source port or product release is required.
          EOF
            gh label create "triage:docs-only" --repo "${{ github.repository }}" --description "Public-owned documentation or website" --color "C5DEF5" --force
            gh pr edit "${PR_NUMBER}" --repo "${{ github.repository }}" --add-label "triage:docs-only"
          elif [[ "${VERDICT}" == "maintainer-review" ]]; then
            cat > /tmp/pr-comment.md <<'EOF'
          Thanks for the contribution. A maintainer will review these delivery or workflow changes. Runtime code, installers and versioned delivery files are maintained upstream. Public documentation and website changes can be reviewed and merged here. Workflow changes require maintainer review.
          EOF
          else
            cat > /tmp/pr-comment.md <<'EOF'
          Thanks for the contribution. Please see [CONTRIBUTING.md](https://github.com/finogeeks/finsafe/blob/main/CONTRIBUTING.md). Engine source changes belong upstream; report behavior defects through a public issue with the tested version and reproduction steps. Documentation and website PRs can be merged directly in this repository.
          EOF
          fi
          sed -i 's/^          //' /tmp/pr-comment.md
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body-file /tmp/pr-comment.md
