name: FinShield documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'integrations/dsh/windows/**', 'integrations/opencode/windows/**', 'pii-plugins/**', 'CHANGELOG.md', 'CONTRIBUTING*.md', 'README*.md', 'AGENTS.md', '.github/workflows/docs-pages.yml', '.github/workflows/pr-mirror-intake.yml']
  pull_request:
    paths: ['docs/**', 'integrations/dsh/windows/**', 'integrations/opencode/windows/**', 'pii-plugins/**', 'CHANGELOG.md', 'CONTRIBUTING*.md', 'README*.md', 'AGENTS.md', '.github/workflows/docs-pages.yml', '.github/workflows/pr-mirror-intake.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      - run: npm run check
        working-directory: docs/site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/site/.generated/.vitepress/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
