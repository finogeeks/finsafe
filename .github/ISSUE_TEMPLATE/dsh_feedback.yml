name: DSH插件问题反馈
description: 反馈FinShield DSH插件的问题，环境信息由插件自动填写。
title: "[DSH 插件] 问题反馈"
labels: [bug, "triage:pending"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题，可附截图。
      placeholder: 我在……时遇到了……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息（自动填写，无需修改）
      description: 标为“未获取”的信息不需要手动补充。
      value: 未获取（可从插件页面的“反馈问题”入口自动填写）
      render: text
    validations:
      required: false
