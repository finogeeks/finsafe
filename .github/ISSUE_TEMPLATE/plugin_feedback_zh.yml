name: 插件问题反馈（中文）
description: 反馈插件使用问题，插件名称和环境信息由插件自动填写。
title: "[插件反馈] 问题反馈"
labels: [bug, "triage:pending"]
body:
  - type: input
    id: plugin
    attributes:
      label: 插件
      description: 已自动填写，无需修改。
      value: 未获取
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题，可附截图。
      placeholder: 我在……时遇到了……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息（自动填写，无需修改）
      description: 标为“未获取”的信息不需要手动补充。
      value: 未获取（可从插件页面的“反馈问题”入口自动填写）
      render: text
    validations:
      required: false
