<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" role="img" aria-labelledby="c4-title c4-description">
<title id="c4-title">FinShield Windows 防护架构</title><desc id="c4-description">用户配置FinShield管理与执行应用，后者包裹启动Agent并准备Windows权限，Agent访问系统对象由Windows检查，网络请求经过网络与内容检查服务进行目标与PII检查，获准请求发送至模型服务并记录加密交换</desc><rect x="0" y="0" width="1160" height="750" fill="#fff"/>
<defs><marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b8092"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.c4-own{fill:#f2f7fc;stroke:#a9c8e3;stroke-width:1.2}.c4-ext{fill:#fafbfc;stroke:#d6dfe7;stroke-width:1.2}.c4-name{fill:#182c3c;font-size:18px!important;font-weight:650}.c4-type{fill:#607687;font-size:14px!important}.c4-tech{fill:#005fb8;font-size:14px!important}.c4-desc{fill:#4e606d;font-size:14px!important}.c4-edge{fill:none;stroke:#6b8092;stroke-width:1.4;marker-end:url(#c4-arrow)}.c4-edge.policy{stroke-dasharray:5 5}.c4-rel{fill:#3b5265;font-size:14px!important}.c4-divider{stroke:#dbe4ec;stroke-width:1}</style><rect x="10" y="155" width="1140" height="585" rx="14" fill="none" stroke="#c7d2dd" stroke-width="1.2" stroke-dasharray="6 5"/><text x="32" y="183" class="c4-name">本机Windows</text><rect class="c4-ext" x="30" y="30" width="265" height="105" rx="10"/><text x="52" y="75" class="c4-name" text-anchor="start">用户与企业管理员</text><text x="52" y="105" class="c4-desc" text-anchor="start">设置权限，掌握Agent操作能力</text><rect class="c4-own" x="30" y="245" width="265" height="165" rx="10"/><text x="52" y="285" class="c4-name" text-anchor="start">FinShield管理与执行</text><text x="52" y="317" class="c4-tech" text-anchor="start">Rust · 控件 / 辅助控制台 / CLI</text><text x="52" y="349" class="c4-desc" text-anchor="start">准备授权 · 统一防护策略</text><text x="52" y="375" class="c4-desc" text-anchor="start">包裹启动 · 进程树监督</text><rect class="c4-ext" x="420" y="245" width="265" height="165" rx="10"/><text x="442" y="285" class="c4-name" text-anchor="start">受保护Agent</text><text x="442" y="325" class="c4-desc" text-anchor="start">执行任务 · 调用工具与子进程</text><text x="442" y="360" class="c4-desc" text-anchor="start">工具子进程继承受控环境</text><rect class="c4-own" x="810" y="245" width="320" height="165" rx="10"/><text x="832" y="285" class="c4-name" text-anchor="start">网络与内容检查服务</text><text x="832" y="317" class="c4-tech" text-anchor="start">已接入流量的本机代理</text><text x="832" y="349" class="c4-desc" text-anchor="start">目标规则 · TLS解密检查</text><text x="832" y="375" class="c4-desc" text-anchor="start">PII告警、阻断与单次审批</text><rect class="c4-ext" x="420" y="550" width="265" height="165" rx="10"/><text x="442" y="605" class="c4-name" text-anchor="start">Windows安全机制</text><text x="442" y="633" class="c4-tech" text-anchor="start">AppContainer · Job Object</text><text x="442" y="661" class="c4-desc" text-anchor="start">Capability SID · ACL · WFP</text><text x="442" y="684" class="c4-desc" text-anchor="start">系统权限、资源与访问检查</text><path class="c4-own" d="M810 562 C810 546,1130 546,1130 562 V703 C1130 719,810 719,810 703 Z"/><path class="c4-divider" fill="none" d="M810 562 C810 578,1130 578,1130 562"/><text x="832" y="610" class="c4-name" text-anchor="start">数据留存</text><text x="832" y="638" class="c4-tech" text-anchor="start">SQLite · AES-GCM · DPAPI</text><text x="832" y="666" class="c4-desc" text-anchor="start">保存请求、响应与处理结果</text><text x="832" y="689" class="c4-desc" text-anchor="start">本地加密存储 · 查看与追溯</text><rect class="c4-ext" x="810" y="30" width="320" height="105" rx="10"/><text x="832" y="75" class="c4-name" text-anchor="start">模型与业务服务</text><text x="832" y="105" class="c4-desc" text-anchor="start">接收获准请求并返回响应</text><path class="c4-edge" d="M162 135V245"/><text x="179" y="183" class="c4-rel" text-anchor="start">设置防护策略</text><text x="179" y="205" class="c4-type" text-anchor="start">界面 / CLI</text><path class="c4-edge" d="M295 327H420"/><text x="357" y="300" class="c4-rel" text-anchor="middle">包裹启动</text><text x="357" y="351" class="c4-type" text-anchor="middle">令牌 / Job</text><path class="c4-edge" d="M685 327H810"/><text x="747" y="300" class="c4-rel" text-anchor="middle">受控请求</text><text x="747" y="351" class="c4-type" text-anchor="middle">HTTP / HTTPS</text><path class="c4-edge policy" d="M295 270H332V190H770V270H810"/><text x="551" y="173" class="c4-rel" text-anchor="middle">应用网络与内容规则 · 本机IPC</text><path class="c4-edge" d="M970 245V135"/><text x="987" y="185" class="c4-rel" text-anchor="start">转发获准请求</text><text x="987" y="207" class="c4-type" text-anchor="start">HTTP / HTTPS</text><path class="c4-edge" d="M552 410V550"/><text x="570" y="469" class="c4-rel" text-anchor="start">访问系统与文件</text><text x="570" y="492" class="c4-type" text-anchor="start">Windows API</text><path class="c4-edge" d="M970 410V550"/><text x="987" y="469" class="c4-rel" text-anchor="start">写入加密记录</text><text x="987" y="492" class="c4-type" text-anchor="start">本机存储</text><path class="c4-edge" d="M162 410V632H420"/><text x="292" y="611" class="c4-rel" text-anchor="middle">准备身份与访问权限</text><text x="292" y="655" class="c4-type" text-anchor="middle">Windows API</text><rect x="35" y="685" width="14" height="14" rx="3" fill="#e7f1fb" stroke="#a9c8e3"/><text x="58" y="697" class="c4-type" text-anchor="start">FinShield运行单元</text><rect x="35" y="715" width="14" height="14" rx="3" fill="#fafbfc" stroke="#d6dfe7"/><text x="58" y="727" class="c4-type" text-anchor="start">Agent与系统服务</text></svg>