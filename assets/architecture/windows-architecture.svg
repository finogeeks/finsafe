<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 750" role="img" aria-labelledby="c4-title c4-description">
<title id="c4-title">FinShield Windows protection architecture</title><desc id="c4-description">FinShield prepares authorized Windows execution. Windows checks system and file access; integrated traffic passes through inspection and can produce encrypted local records.</desc><rect x="0" y="0" width="1160" height="750" fill="#fff"/>
<defs><marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b8092"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.c4-own{fill:#f2f7fc;stroke:#a9c8e3;stroke-width:1.2}.c4-ext{fill:#fafbfc;stroke:#d6dfe7;stroke-width:1.2}.c4-name{fill:#182c3c;font-size:18px!important;font-weight:650}.c4-type{fill:#607687;font-size:14px!important}.c4-tech{fill:#005fb8;font-size:14px!important}.c4-desc{fill:#4e606d;font-size:14px!important}.c4-edge{fill:none;stroke:#6b8092;stroke-width:1.4;marker-end:url(#c4-arrow)}.c4-edge.policy{stroke-dasharray:5 5}.c4-rel{fill:#3b5265;font-size:14px!important}.c4-divider{stroke:#dbe4ec;stroke-width:1}</style><rect x="10" y="155" width="1140" height="585" rx="14" fill="none" stroke="#c7d2dd" stroke-width="1.2" stroke-dasharray="6 5"/><text x="32" y="183" class="c4-name">Windows host</text><rect class="c4-ext" x="30" y="30" width="265" height="105" rx="10"/><text x="52" y="75" class="c4-name" text-anchor="start">Users and administrators</text><text x="52" y="105" class="c4-desc" text-anchor="start">Set Agent permissions</text><rect class="c4-own" x="30" y="245" width="265" height="165" rx="10"/><text x="52" y="285" class="c4-name" text-anchor="start">FinShield control app</text><text x="52" y="317" class="c4-tech" text-anchor="start">Rust · Widget / Console / CLI</text><text x="52" y="349" class="c4-desc" text-anchor="start">Authorization · Protection policy</text><text x="52" y="375" class="c4-desc" text-anchor="start">Controlled launch · Process tree</text><rect class="c4-ext" x="420" y="245" width="265" height="165" rx="10"/><text x="442" y="285" class="c4-name" text-anchor="start">Protected Agent</text><text x="442" y="325" class="c4-desc" text-anchor="start">Tasks · Tools · Child processes</text><text x="442" y="360" class="c4-desc" text-anchor="start">Controlled child execution</text><rect class="c4-own" x="810" y="245" width="320" height="165" rx="10"/><text x="832" y="285" class="c4-name" text-anchor="start">Network / content inspection</text><text x="832" y="317" class="c4-tech" text-anchor="start">Local proxy for integrated traffic</text><text x="832" y="349" class="c4-desc" text-anchor="start">Destination rules · TLS inspection</text><text x="832" y="375" class="c4-desc" text-anchor="start">PII: record / block / ask once</text><rect class="c4-ext" x="420" y="550" width="265" height="165" rx="10"/><text x="442" y="605" class="c4-name" text-anchor="start">Windows security controls</text><text x="442" y="633" class="c4-tech" text-anchor="start">AppContainer · Job Object</text><text x="442" y="661" class="c4-desc" text-anchor="start">Capability SID · ACL · WFP</text><text x="442" y="684" class="c4-desc" text-anchor="start">System / resource / access checks</text><path class="c4-own" d="M810 562 C810 546,1130 546,1130 562 V703 C1130 719,810 719,810 703 Z"/><path class="c4-divider" fill="none" d="M810 562 C810 578,1130 578,1130 562"/><text x="832" y="610" class="c4-name" text-anchor="start">Local retention</text><text x="832" y="638" class="c4-tech" text-anchor="start">SQLite · AES-GCM · DPAPI</text><text x="832" y="666" class="c4-desc" text-anchor="start">Requests · Responses · Decisions</text><text x="832" y="689" class="c4-desc" text-anchor="start">Encrypted storage · Review</text><rect class="c4-ext" x="810" y="30" width="320" height="105" rx="10"/><text x="832" y="75" class="c4-name" text-anchor="start">Model / business services</text><text x="832" y="105" class="c4-desc" text-anchor="start">Receive approved requests</text><path class="c4-edge" d="M162 135V245"/><text x="179" y="183" class="c4-rel" text-anchor="start">Set policy</text><text x="179" y="205" class="c4-type" text-anchor="start">UI / CLI</text><path class="c4-edge" d="M295 327H420"/><text x="357" y="300" class="c4-rel" text-anchor="middle">Controlled launch</text><text x="357" y="351" class="c4-type" text-anchor="middle">Token / Job</text><path class="c4-edge" d="M685 327H810"/><text x="747" y="300" class="c4-rel" text-anchor="middle">Routed requests</text><text x="747" y="351" class="c4-type" text-anchor="middle">HTTP / HTTPS</text><path class="c4-edge policy" d="M295 270H332V190H770V270H810"/><text x="551" y="173" class="c4-rel" text-anchor="middle">Apply network / content rules · Local IPC</text><path class="c4-edge" d="M970 245V135"/><text x="987" y="185" class="c4-rel" text-anchor="start">Forward approved</text><text x="987" y="207" class="c4-type" text-anchor="start">HTTP / HTTPS</text><path class="c4-edge" d="M552 410V550"/><text x="570" y="469" class="c4-rel" text-anchor="start">System / file access</text><text x="570" y="492" class="c4-type" text-anchor="start">Windows API</text><path class="c4-edge" d="M970 410V550"/><text x="987" y="469" class="c4-rel" text-anchor="start">Encrypted records</text><text x="987" y="492" class="c4-type" text-anchor="start">Local storage</text><path class="c4-edge" d="M162 410V632H420"/><text x="292" y="611" class="c4-rel" text-anchor="middle">Prepare identity / access</text><text x="292" y="655" class="c4-type" text-anchor="middle">Windows API</text><rect x="35" y="685" width="14" height="14" rx="3" fill="#e7f1fb" stroke="#a9c8e3"/><text x="58" y="697" class="c4-type" text-anchor="start">FinShield components</text><rect x="35" y="715" width="14" height="14" rx="3" fill="#fafbfc" stroke="#d6dfe7"/><text x="58" y="727" class="c4-type" text-anchor="start">Agent / system services</text></svg>