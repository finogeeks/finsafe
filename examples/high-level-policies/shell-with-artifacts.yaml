schema_version: 1
policy_id: enterprise-shell-artifacts-v1

filesystem:
  read_only_paths:
    - /usr
    - /lib
    - /lib64
  read_write_paths:
    - /workspace

resources:
  memory_max: "268435456"     # 256 MiB
  pids_max: "64"
  cpu_max: "50000 100000"     # half a core
  timeout_ms: 15000

network:
  mode: deny

syscalls: default

artifacts:
  collect:
    - /workspace/out
  max_bytes: 10485760         # 10 MiB
  retention_policy: tenant-default
