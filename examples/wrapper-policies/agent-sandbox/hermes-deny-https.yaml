# Hermes oneshot with outbound network denied (`network: none`).
# Tests that hermes starts but LLM/API HTTPS cannot complete.
# Cross-platform: do not use `macos_seatbelt.deny_outbound_ports` here — Linux
# `finsafe run` fail-closes on that field (#223). Prefer `network: none` (fails
# fast; see F3) over Seatbelt port denies.
# Key difference from deny-https.yaml: includes uv Python runtime path.
# Usage:
#   finsafe --policy examples/wrapper-policies/agent-sandbox/hermes-deny-https.yaml run -- \
#       /usr/bin/env HOME="$HOME" PATH="/opt/homebrew/bin:$HOME/.local/bin:/usr/bin:/bin" \
#       hermes chat -q "Reply ok" -Q --source tool
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
stdio:
  mode: inherit
network: none
resources:
  memory_max: "512M"
  pids_max: "64"
  cpu_max: "100000 100000"
  timeout_ms: 20000
filesystem:
  skip_default_deny_read: true
  read_only_paths:
    - "."
    - "/usr"
    - "/bin"
    - "/sbin"
    - "${HOME}/.local/bin"
    - "${HOME}/.local/share/uv/python"
    - "/opt/homebrew/bin"
    - "${HOME}/.hermes"
  read_write_paths:
    - "./workspace"
    - "${HOME}/.hermes"
