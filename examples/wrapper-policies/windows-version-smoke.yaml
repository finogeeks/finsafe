# Short-lived Windows smoke: wrap a one-shot command (no Hermes / Unix paths).
# Uses `network: none` (strict network lockdown). On a personal desktop run once:
#   finsafe setup-windows
# before this policy, or use windows-sandbox-smoke.yaml (`network: host`) for a no-setup smoke.
# From the repo root on Windows:
#   finsafe --policy examples/wrapper-policies/windows-version-smoke.yaml run cmd /c echo hello
# FinSAFE auto-creates `./workspace` when missing and sets child cwd there when it is the
# sole read_write_paths entry. Use `cmd /c echo hello` for smoke tests — not `cmd /c dir`
# from an ungranted cwd (`dir` lists the process working directory).
# Paths under `filesystem` use ${USERPROFILE}; FinSAFE expands these when the policy loads
# (the `finsafe` process environment — not the child argv). `~/` and ${HOME} are expanded at load time.
# Only paths that exist on the host when the policy loads are applied; create `./workspace` first
# if you rely on that RW scope. See docs/public-finsafe/docs/POLICY-QUICKREF.md.
#
# Do not list C:\Windows\System32 (or other Windows-owned trees) under read_only_paths:
# inheritable grants relabel every descendant and fail on hosted runners. FinSAFE winsafe
# already applies non-inheritable read+execute on System32, SysWOW64, and WinSxS for cmd/DLL load.
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
network: none
resources:
  memory_max: "512M"
  pids_max: "64"
  cpu_max: "100000 100000"
  # Wall-clock safety net for CI; cmd echo should finish in seconds. Keep well below
  # the windows-acceptance job watchdog so wedged children fail fast, not at 2+ minutes.
  timeout_ms: 30000
windows:
  backend: appcontainer
filesystem:
  read_only_paths: []
  read_write_paths:
    - "./workspace"
