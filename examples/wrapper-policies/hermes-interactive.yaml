# Wrap a long-lived interactive `hermes` broker in FinSAFE self-confine mode.
# Use with:
#   finsafe --policy examples/wrapper-policies/hermes-interactive.yaml self-confine \\
#       /usr/bin/env HOME="$HOME" PATH="/opt/homebrew/bin:$HOME/.local/bin:/usr/bin:/bin" hermes
# Paths under `filesystem` use ${HOME} and ${XDG_CONFIG_HOME}; FinSAFE expands these from the finsafe loader process environment when the policy loads (distinct from `--` argv). Tilde (~) inside YAML paths is not expanded.
# On macOS: FinSAFE emits a pre-exec audit envelope, then execs Hermes via sandbox-exec (Seatbelt).
# On Linux strict: FinSAFE applies cgroup v2 + Landlock + seccomp to itself, then execs Hermes.
schema_version: 1
kind: local-wrapper
program_mode: interactive
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
# self-confine preserves the broker's inherited terminal by execing into it.
stdio:
  mode: inherit
# host: Hermes needs outbound HTTPS for LLM API calls.
network: host
resources:
  memory_max: "1G"
  pids_max: "256"
  cpu_max: "100000 100000"
filesystem:
  # macOS deny-default Seatbelt requires every needed local path to be declared.
  # `.` lets Hermes inspect the current working directory; the `${HOME}` / `${XDG_CONFIG_HOME}`
  # entries keep the examples portable. Homebrew distributes `gh` as a symlink; allowing
  # `/opt/homebrew/bin` is usually enough alongside the explicit `/opt/homebrew/bin/gh` entrypoint
  # reference (narrower than exposing an entire Formula Cellar tree).
  read_only_paths:
    - "."
    - "/usr"
    - "/lib"
    - "/lib64"
    - "/bin"
    - "/sbin"
    - "${HOME}/.local/bin"
    - "${HOME}/.local/share/uv/python"
    - "/opt/homebrew/bin"
    - "/opt/homebrew/bin/gh"
    # Intel Homebrew (uncomment if needed): "/usr/local/bin" and "/usr/local/bin/gh"
    - "${XDG_CONFIG_HOME}/gh"
  read_write_paths:
    - "./workspace"
    - "${HOME}/.hermes"
