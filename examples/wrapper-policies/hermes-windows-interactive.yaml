# Windows: run the interactive Hermes broker under AppContainer via
# `self-confine`.
# From an interactive PowerShell / Windows Terminal prompt in your project dir:
#   mkdir workspace 2>$null
#   finsafe --policy examples/wrapper-policies/hermes-windows-interactive.yaml self-confine -- hermes
#
# What happens:
# - FinSAFE compiles this policy and spawns Hermes under AppContainer / LowBox
#   plus a Job object. FinSAFE stays resident as the supervisor until Hermes
#   exits.
# - On a real TTY the broker shares the operator console. Set
#   `FINSAFE_WIN_PTY_MODE=live` only when an embedded host needs FinSAFE to be
#   the terminal host. Ctrl+C goes to Hermes; Ctrl+Break stops the session.
# - Without a TTY (CI, redirection) output is captured and replayed after
#   exit — use the oneshot policy for scripted runs instead.
#
# Notes:
# - `program_mode: interactive` + no `resources.timeout_ms`: interactive
#   sessions are open-ended. (The oneshot example's 120s timeout would kill
#   a live session.)
# - Paths use ${USERPROFILE}; create `./workspace` first.
# - Explicit `windows.backend: restricted_token` is a retired-backend error.
schema_version: 1
kind: local-wrapper
program_mode: interactive
degrade:
  allow_fallback: false
audit:
  require_policy_digest: true
  require_resolved_posture: true
# host: hermes needs outbound HTTPS for LLM API calls
network: host
resources:
  memory_max: "2G"
  pids_max: "256"
  cpu_max: "100000 100000"
windows:
  backend: appcontainer
filesystem:
  read_only_paths: []
  read_write_paths:
    - "./workspace"
    - '${USERPROFILE}\.hermes'
