# Windows: wrap one-shot Hermes under RestrictedToken (default desktop path).
# From a PowerShell prompt in your project directory:
#   mkdir workspace 2>$null
#   finsafe --policy examples/wrapper-policies/hermes-windows-oneshot.yaml run hermes --version
#   finsafe --policy examples/wrapper-policies/hermes-windows-oneshot.yaml run hermes chat -q "Reply with exactly: ok" -Q --source tool
#
# Backend: WRITE_RESTRICTED RestrictedToken (Codex-aligned weaker posture)
# - Host-wide read (Hermes can read its venv / site-packages without recursive
#   AppContainer DACL labeling or ProjFS projection).
# - Writes are deny-by-default and allowlisted on read_write_paths only.
# - Built-in confidential deny-read is skipped for this path (host-wide read).
# - No AppContainer LowBox profile; attestation reports windows_restricted_token
#   and degraded_execution=true.
#
# Prefer this for typical Hermes / network:host agents. For stronger AppContainer
# isolation (deny-read, WFP fencing on none/allowlist), see
# hermes-windows-oneshot-appcontainer.yaml.
#
# Notes:
# - Do NOT add the venv (or `.`) to read_only_paths — unnecessary on RestrictedToken
#   and harmful on AppContainer (large-tree ACL guard).
# - Do NOT set `stdio: { mode: inherit }` for interactive PowerShell use; the
#   default capture mode replays output after the child exits.
# - Paths use ${USERPROFILE}; FinSAFE expands them when the policy loads, and
#   only paths that exist are applied — create `./workspace` first.
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: false
audit:
  require_policy_digest: true
  require_resolved_posture: true
# host: hermes needs outbound HTTPS for LLM API calls
network: host
resources:
  memory_max: "1G"
  pids_max: "256"
  cpu_max: "100000 100000"
  timeout_ms: 120000
windows:
  backend: restricted_token
filesystem:
  # Explicit opt-out documents the weaker path; Auto+host also skips builtins.
  skip_default_deny_read: true
  read_only_paths: []
  read_write_paths:
    - "./workspace"
    - "${USERPROFILE}/.hermes"
