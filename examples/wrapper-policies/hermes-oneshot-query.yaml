# Wrap a short-lived `hermes chat -q "..."` oneshot query in a FinSAFE sandbox.
# Proves FinSAFE confinement is applied while Hermes operates normally (LLM call + response).
# On macOS deny-default Seatbelt, invoke with explicit HOME/PATH. The policy
# defaults to stdio inherit for clean one-shot terminal output, for example:
#   finsafe --policy examples/wrapper-policies/hermes-oneshot-query.yaml run \\
#       /usr/bin/env HOME="$HOME" PATH="/opt/homebrew/bin:$HOME/.local/bin:/usr/bin:/bin" \\
#           hermes chat -q "Reply with exactly: ok" -Q --source tool
# Paths under `filesystem` use ${HOME} and ${XDG_CONFIG_HOME}; FinSAFE expands these when the policy loads. Tilde (~) inside YAML paths is not expanded.
# On macOS: sandbox-exec (Seatbelt) confinement.
# On Linux strict: bubblewrap + cgroup v2 + Landlock.
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
# Preserve clean one-shot Hermes terminal output by default.
# `finsafe --json` still defaults to capture for machine-readable audit output.
stdio:
  mode: inherit
# host: hermes needs outbound HTTPS for LLM API calls
network: host
resources:
  memory_max: "1G"
  pids_max: "256"
  cpu_max: "100000 100000"
  timeout_ms: 60000
filesystem:
  # macOS deny-default Seatbelt requires every needed local path to be declared.
  # `.` lets Hermes inspect the current working directory; the `${HOME}` / `${XDG_CONFIG_HOME}`
  # entries keep the examples portable. Homebrew distributes `gh` as a symlink; allowing
  # `/opt/homebrew/bin` is usually enough alongside the explicit `/opt/homebrew/bin/gh` entrypoint
  # reference (narrower than exposing an entire Formula Cellar tree).
  read_only_paths:
    - "."
    - "/usr"
    - "/lib"
    - "/lib64"
    - "/bin"
    - "/sbin"
    - "${HOME}/.local/bin"
    - "${HOME}/.local/share/uv/python"
    - "/opt/homebrew/bin"
    - "/opt/homebrew/bin/gh"
    # Intel Homebrew (uncomment if needed): "/usr/local/bin" and "/usr/local/bin/gh"
    - "${XDG_CONFIG_HOME}/gh"
  read_write_paths:
    - "./workspace"
    - "${HOME}/.hermes"
  # Optional (policy compiler) — see docs/POLICY-QUICKREF.md
  # protected_read_only_paths: []
  # skip_default_protected_paths: false
  # deny_read_paths: ["./workspace/.env"]   # deny read under writable roots (not read_only_paths)
  # skip_default_deny_read: false             # Linux/macOS: built-in deny-read (.env, ~/.ssh, …) unless true
  # deny_write_globs: ["*.pem", "**/*.pem"]   # writes blocked; alias: deny_read_globs
  # glob_scan_max_depth: 8
