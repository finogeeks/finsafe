# Short-lived smoke: wrap `hermes --version` (or similar one-shot Hermes CLI).
# On Linux strict + bwrap/Landlock, FinSAFE invokes the child inside the sandbox.
# On macOS, FinSAFE runs the child via `sandbox-exec` (Seatbelt MVP) under `mac-seatbelt`.
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
network: host
resources:
  memory_max: "512M"
  pids_max: "64"
  cpu_max: "100000 100000"
filesystem:
  read_only_paths: ["/usr", "/lib", "/lib64", "/bin", "/sbin"]
  read_write_paths: ["./workspace"]
