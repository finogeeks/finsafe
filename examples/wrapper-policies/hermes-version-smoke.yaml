# Short-lived smoke: wrap `hermes --version` (or similar one-shot Hermes CLI).
# On macOS deny-default Seatbelt, invoke with explicit HOME/PATH, for example:
#   finsafe --policy examples/wrapper-policies/hermes-version-smoke.yaml run --json \\
#       /usr/bin/env HOME="$HOME" PATH="/opt/homebrew/bin:$HOME/.local/bin:/usr/bin:/bin" hermes --version
# Paths under `filesystem` use ${HOME} and ${XDG_CONFIG_HOME}; FinSAFE expands these when the policy loads. Tilde (~) inside YAML paths is not expanded.
# On Linux strict + bwrap/Landlock, FinSAFE invokes the child inside the sandbox.
# On macOS, FinSAFE runs the child via `sandbox-exec` (Seatbelt MVP) under `mac-seatbelt`.
schema_version: 1
kind: local-wrapper
program_mode: short-lived
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
network: host
resources:
  memory_max: "512M"
  pids_max: "64"
  cpu_max: "100000 100000"
filesystem:
  # macOS deny-default Seatbelt requires every needed local path to be declared.
  # `.` lets Hermes inspect the current working directory; the `${HOME}` / `${XDG_CONFIG_HOME}`
  # entries keep the examples portable. Homebrew distributes `gh` as a symlink; allowing
  # `/opt/homebrew/bin` is usually enough alongside the explicit `/opt/homebrew/bin/gh` entrypoint
  # reference (narrower than exposing an entire Formula Cellar tree).
  read_only_paths:
    - "."
    - "/usr"
    - "/lib"
    - "/lib64"
    - "/bin"
    - "/sbin"
    - "${HOME}/.local/bin"
    - "${HOME}/.local/share/uv/python"
    - "/opt/homebrew/bin"
    - "/opt/homebrew/bin/gh"
    # Intel Homebrew (uncomment if needed): "/usr/local/bin" and "/usr/local/bin/gh"
    - "${XDG_CONFIG_HOME}/gh"
  read_write_paths:
    - "./workspace"
    - "${HOME}/.hermes"
