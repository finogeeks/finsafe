# Wrap interactive Hermes while allowing normal HTTPS LLM calls but denying outbound HTTP.
# Use with:
#   finsafe --policy examples/wrapper-policies/hermes-interactive-deny-http.yaml self-confine \\
#       /usr/bin/env HOME="$HOME" PATH="/opt/homebrew/bin:$HOME/.local/bin:/usr/bin:/bin" hermes
# Paths under `filesystem` use ${HOME} and ${XDG_CONFIG_HOME}; FinSAFE expands these when the policy loads from the finsafe loader environment. Tilde (~) inside YAML paths is not expanded.
# macOS Seatbelt note: this is port-based, not domain-based. It denies outbound port 80.
schema_version: 1
kind: local-wrapper
program_mode: interactive
degrade:
  allow_fallback: true
audit:
  require_policy_digest: true
  require_resolved_posture: true
stdio:
  mode: inherit
macos_seatbelt:
  deny_outbound_ports: [80]
# host keeps HTTPS model-provider calls available; macos_seatbelt above denies the test port.
network: host
resources:
  memory_max: "1G"
  pids_max: "256"
  cpu_max: "100000 100000"
filesystem:
  # macOS deny-default Seatbelt requires every needed local path to be declared.
  # `.` lets Hermes inspect the current working directory; the `${HOME}` / `${XDG_CONFIG_HOME}`
  # entries keep the examples portable. Homebrew distributes `gh` as a symlink; allowing
  # `/opt/homebrew/bin` is usually enough alongside the explicit `/opt/homebrew/bin/gh` entrypoint
  # reference (narrower than exposing an entire Formula Cellar tree).
  read_only_paths:
    - "."
    - "/usr"
    - "/lib"
    - "/lib64"
    - "/bin"
    - "/sbin"
    - "${HOME}/.local/bin"
    - "${HOME}/.local/share/uv/python"
    - "/opt/homebrew/bin"
    - "/opt/homebrew/bin/gh"
    # Intel Homebrew (uncomment if needed): "/usr/local/bin" and "/usr/local/bin/gh"
    - "${XDG_CONFIG_HOME}/gh"
  read_write_paths:
    - "./workspace"
    - "${HOME}/.hermes"
