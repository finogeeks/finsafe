[workspace]
resolver = "2"
members = ["protocol", "sdk", "devtool", "examples/employee", "examples/redactor"]

[workspace.package]
version = "0.10.51"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
windows-sys = "0.52"

[profile.dev]
debug = 2
