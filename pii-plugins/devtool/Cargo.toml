[package]
name = "finshield-pii-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
finsafe-pii-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.0", features = ["rt", "net", "io-util", "time", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_JobObjects"] }
